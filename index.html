<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Брокер ГРАНИ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:#f4f5f7;--surface:#fff;--border:#e3e6eb;--text:#171a21;--muted:#6b7280;--faint:#9aa0aa;--accent:#2c6bff;--accent-soft:#edf2ff;--shadow:0 8px 24px rgba(19,28,45,.07)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;margin:0;overflow-x:hidden;touch-action:pan-y}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button{font:inherit}.screen{min-height:100vh;min-height:100dvh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}.hidden{display:none!important}
  .topbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;min-height:60px;padding:8px 14px;background:rgba(244,245,247,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
  .brand{text-align:center}.brand strong{display:block;font-size:15px}.brand span{display:block;margin-top:2px;color:var(--faint);font-size:11px}
  .round-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--text);cursor:pointer;font-size:27px}
  .hero{text-align:center;padding:22px 20px 14px}.logo{width:70px;height:70px;margin:0 auto 13px;border-radius:21px;background:#11151d;color:#fff;display:grid;place-items:center;font-size:31px;font-weight:800;box-shadow:0 10px 24px rgba(14,16,19,.18)}
  h1{margin:0;font-size:21px;letter-spacing:.045em}.subtitle{max-width:330px;margin:8px auto 0;color:var(--muted);font-size:13.5px;line-height:1.5}
  .menu{display:grid;gap:10px;padding:10px 16px}.menu-btn{width:100%;min-height:62px;border:1px solid var(--border);border-radius:17px;background:var(--surface);display:grid;grid-template-columns:42px 1fr 18px;align-items:center;gap:12px;padding:10px 14px;text-align:left;cursor:pointer;box-shadow:0 2px 8px rgba(19,28,45,.025)}
  .menu-btn:active{transform:scale(.988);background:#fafbfc}.menu-btn.primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,#2c6bff,#1f54dc);box-shadow:0 10px 22px rgba(44,107,255,.23)}
  .menu-icon{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px}.primary .menu-icon{background:rgba(255,255,255,.16)}
  .menu-copy strong{display:block;font-size:15px;line-height:1.25}.menu-copy span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.3}.primary .menu-copy span{color:rgba(255,255,255,.76)}
  .arrow{color:var(--faint);font-size:23px}.primary .arrow{color:rgba(255,255,255,.8)}.section-label{padding:9px 18px 0;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .detail-head{text-align:center;padding:22px 18px 12px}.detail-icon{width:58px;height:58px;margin:auto;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;font-size:29px}.detail-head h2{margin:12px 0 4px;font-size:21px}.detail-head p{margin:0;color:var(--muted);font-size:13px}
  .conversation{padding:10px 16px 24px}.message{position:relative;max-width:100%;padding:17px 17px 16px;border:1px solid var(--border);border-radius:18px 18px 18px 5px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;line-height:1.55;animation:message-in .22s ease-out both;overflow-wrap:anywhere}.message p{margin:0 0 12px}.message p:last-child{margin-bottom:0}.message ul{margin:9px 0 0;padding-left:20px}.message li+li{margin-top:6px}.message-note{color:var(--muted);font-size:13px}.message-title{font-size:17px;font-weight:700}
  @keyframes message-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.message{animation:none}}
  .detail-action{width:100%;margin-top:14px;border:0;border-radius:15px;padding:15px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}.detail-action:active{filter:brightness(.95)}.footer-note{padding:5px 18px 0;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.45}
</style>
</head>
<body>
<main id="menuScreen" class="screen">
  <header class="topbar"><span></span><div class="brand"><strong>Брокер ГРАНИ</strong><span>мини-приложение</span></div><span></span></header>
  <section class="hero"><div class="logo">Г</div><h1>БРОКЕР ГРАНИ</h1><p class="subtitle">СБКТС, ЭПТС, утильсбор и таможенное оформление автомобилей</p></section>
  <div class="section-label">Расчёты</div>
  <nav class="menu" aria-label="Расчёты">
    <button class="menu-btn primary" type="button" data-link="tabs/utilsbor/index.html"><span class="menu-icon">🧮</span><span class="menu-copy"><strong>Рассчитать утильсбор</strong><span>По автомобилю или документу СБКТС</span></span><span class="arrow">›</span></button>
    <button class="menu-btn" type="button" data-link="tabs/utilsbor/index.html?mode=peni"><span class="menu-icon">📅</span><span class="menu-copy"><strong>Рассчитать пени</strong><span>Точный расчёт по дате оформления СБКТС</span></span><span class="arrow">›</span></button>
  </nav>
  <div class="section-label">Услуги и информация</div>
  <nav class="menu" aria-label="Услуги и информация">
    <button class="menu-btn" type="button" data-section="payment"><span class="menu-icon">💳</span><span class="menu-copy"><strong>Как оплатить утильсбор</strong><span>Порядок оплаты и важные проверки</span></span><span class="arrow">›</span></button>
    <button class="menu-btn" type="button" data-section="sbkts"><span class="menu-icon">📄</span><span class="menu-copy"><strong>Оформить СБКТС</strong><span>Сопровождение оформления документа</span></span><span class="arrow">›</span></button>
    <button class="menu-btn" type="button" data-section="epts"><span class="menu-icon">🔎</span><span class="menu-copy"><strong>Найти ЭПТС по VIN</strong><span>Проверка электронного паспорта автомобиля</span></span><span class="arrow">›</span></button>
    <button class="menu-btn" type="button" data-section="owner"><span class="menu-icon">👤</span><span class="menu-copy"><strong>Внести собственника в ЭПТС</strong><span>Помощь с изменением сведений</span></span><span class="arrow">›</span></button>
    <button class="menu-btn" type="button" data-section="contact"><span class="menu-icon">💬</span><span class="menu-copy"><strong>Написать нам</strong><span>Задать вопрос специалисту</span></span><span class="arrow">›</span></button>
    <button class="menu-btn" type="button" data-section="donate"><span class="menu-icon">❤️</span><span class="menu-copy"><strong>Поддержать проект</strong><span>Помочь развитию бесплатного сервиса</span></span><span class="arrow">›</span></button>
  </nav>
  <p class="footer-note">Расчёты носят информационный характер. Итоговые данные проверяются по документам автомобиля.</p>
</main>
<main id="detailScreen" class="screen hidden">
  <header class="topbar"><button id="backBtn" class="round-btn" type="button" aria-label="Вернуться в меню">‹</button><div class="brand"><strong id="topTitle">Информация</strong><span>Брокер ГРАНИ</span></div><span></span></header>
  <section class="detail-head"><div id="detailIcon" class="detail-icon"></div><h2 id="detailTitle"></h2><p>Информация по услуге</p></section>
  <section class="conversation"><article id="detailMessage" class="message"></article><button id="detailAction" class="detail-action hidden" type="button"></button></section>
</main>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#F4F5F7');tg.setBackgroundColor('#F4F5F7')}catch(e){}tg.BackButton.hide()}

/* Вставьте сюда ссылки, когда они будут готовы. */
const CONTACT_URL='';
const DONATE_URL='';
const STORAGE_KEY='grani_home_v2';
const sections={
  payment:{icon:'💳',title:'Как оплатить утильсбор',html:'<p class="message-title">Порядок оплаты утильсбора</p><p>Сначала рассчитайте сумму и проверьте сведения автомобиля в СБКТС и ЭПТС.</p><ul><li>Сверьте плательщика, VIN и характеристики автомобиля.</li><li>Получите актуальные реквизиты и назначение платежа.</li><li>После оплаты сохраните чек или платёжное поручение.</li></ul><p class="message-note">Не переводите деньги по устаревшим реквизитам. Точные данные для платежа зависят от способа оформления.</p>',action:'Получить реквизиты',url:()=>CONTACT_URL},
  sbkts:{icon:'📄',title:'Оформить СБКТС',html:'<p class="message-title">Поможем оформить СБКТС</p><p>Проверим исходные данные автомобиля, подскажем порядок оформления и сопроводим получение документа.</p><p>Для начала подготовьте VIN и имеющиеся документы на автомобиль. Точный перечень и срок специалист сообщит после проверки вашей ситуации.</p>',action:'Написать специалисту',url:()=>CONTACT_URL},
  epts:{icon:'🔎',title:'Найти ЭПТС по VIN',html:'<p class="message-title">Проверка ЭПТС по VIN</p><p>Отправьте специалисту VIN автомобиля. Мы проверим наличие электронного паспорта и сообщим результат.</p><p class="message-note">VIN обычно содержит 17 символов. Перед отправкой проверьте, что он введён без пробелов и ошибок.</p>',action:'Отправить VIN',url:()=>CONTACT_URL},
  owner:{icon:'👤',title:'Внести собственника в ЭПТС',html:'<p class="message-title">Внесение собственника в ЭПТС</p><p>Поможем проверить статус электронного паспорта и внести сведения о собственнике.</p><p>Для предварительной проверки сообщите VIN и номер ЭПТС. Перечень необходимых документов специалист уточнит для вашей ситуации.</p>',action:'Написать специалисту',url:()=>CONTACT_URL},
  contact:{icon:'💬',title:'Написать нам',html:'<p class="message-title">Свяжитесь со специалистом</p><p>Опишите вопрос и, если он связан с автомобилем, приложите VIN и имеющиеся документы. Так мы сможем ответить точнее.</p><p class="message-note">Контактная ссылка будет доступна после добавления аккаунта менеджера.</p>',action:'Открыть Telegram',url:()=>CONTACT_URL},
  donate:{icon:'❤️',title:'Поддержать проект',html:'<p class="message-title">Спасибо за поддержку!</p><p>Сервис развивается, чтобы расчёты и информация по оформлению автомобилей оставались удобными и доступными.</p><p>Ваш донат поможет поддерживать справочники в актуальном состоянии и добавлять новые функции.</p><p class="message-note">Ссылка для поддержки появится здесь после подключения выбранного способа оплаты.</p>',action:'Поддержать проект',url:()=>DONATE_URL}
};
const menuScreen=document.getElementById('menuScreen'),detailScreen=document.getElementById('detailScreen'),backBtn=document.getElementById('backBtn');let currentSection='';
function storageSet(value){const json=JSON.stringify(value);if(tg&&tg.CloudStorage)tg.CloudStorage.setItem(STORAGE_KEY,json,()=>{});try{localStorage.setItem(STORAGE_KEY,json)}catch(e){}}
function storageGet(callback){if(tg&&tg.CloudStorage){tg.CloudStorage.getItem(STORAGE_KEY,(err,value)=>{if(!err&&value){callback(value);return}try{callback(localStorage.getItem(STORAGE_KEY))}catch(e){callback(null)}})}else{try{callback(localStorage.getItem(STORAGE_KEY))}catch(e){callback(null)}}}
function rememberSection(id){storageGet(raw=>{let state={visited:[]};try{if(raw)state=JSON.parse(raw)||state}catch(e){}const visited=Array.isArray(state.visited)?state.visited.filter(x=>x!==id):[];visited.push(id);storageSet({visited:visited.slice(-20),last:id,updated:Date.now()})})}
function openSection(id,shouldRemember=true){const section=sections[id];if(!section)return;currentSection=id;document.getElementById('topTitle').textContent=section.title;document.getElementById('detailIcon').textContent=section.icon;document.getElementById('detailTitle').textContent=section.title;const message=document.getElementById('detailMessage');message.innerHTML=section.html;message.style.animation='none';void message.offsetWidth;message.style.animation='';const action=document.getElementById('detailAction'),url=section.url();if(url){action.textContent=section.action;action.dataset.url=url;action.classList.remove('hidden')}else{action.classList.add('hidden');action.dataset.url=''}menuScreen.classList.add('hidden');detailScreen.classList.remove('hidden');window.scrollTo(0,0);if(tg)tg.BackButton.show();if(shouldRemember)rememberSection(id)}
function showMenu(){currentSection='';detailScreen.classList.add('hidden');menuScreen.classList.remove('hidden');window.scrollTo(0,0);if(tg)tg.BackButton.hide()}
function haptic(){if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.impactOccurred('light')}catch(e){}}
document.querySelectorAll('[data-link]').forEach(btn=>btn.addEventListener('click',()=>{haptic();window.location.href=btn.dataset.link}));
document.querySelectorAll('[data-section]').forEach(btn=>btn.addEventListener('click',()=>{haptic();openSection(btn.dataset.section)}));
backBtn.addEventListener('click',showMenu);if(tg)tg.BackButton.onClick(()=>{if(currentSection)showMenu()});
document.getElementById('detailAction').addEventListener('click',function(){const url=this.dataset.url;if(!url)return;if(tg&&tg.openTelegramLink&&url.indexOf('https://t.me/')===0)tg.openTelegramLink(url);else if(tg&&tg.openLink)tg.openLink(url);else window.location.href=url});
</script>
</body>
</html>
