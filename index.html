<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Брокер ГРАНИ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --h-bg:#F4F5F7; --h-surface:#FFFFFF; --h-border:#E6E8EC;
    --h-text-primary:#0E1013; --h-text-body:#1F2430; --h-text-secondary:#4B5563;
    --h-text-muted:#6B7280; --h-text-faint:#9AA0AA;
    --h-accent:#2C6BFF; --h-accent-tint:#EDF2FF; --h-ink:#0E1013;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--h-bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow-x:hidden;
  }
  #home-screen{min-height:100vh; min-height:100dvh; background:var(--h-bg); -webkit-overflow-scrolling:touch;}
  .home-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
  .home-topbar .dots{display:flex;align-items:center;gap:6px;background:rgba(14,16,19,0.06);border-radius:999px;padding:5px 10px;color:var(--h-text-secondary);font-size:13px;letter-spacing:2px;}
  .home-brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 24px 20px;}
  .home-logo{width:76px;height:76px;border-radius:22px;background:var(--h-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(14,16,19,0.18);}
  .home-logo img{width:44px;height:auto;display:block;}
  .home-title{font-family:'Unbounded',sans-serif;color:var(--h-text-primary);font-size:21px;font-weight:700;letter-spacing:0.06em;}
  .home-subtitle{color:var(--h-text-muted);font-size:13.5px;line-height:1.5;text-align:center;max-width:280px;}
  .home-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .home-badge{background:#fff;border:1px solid var(--h-border);color:var(--h-text-secondary);font-size:12px;font-weight:500;border-radius:999px;padding:5px 12px;}
  .home-cta{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#2C6BFF 0%,#1E4FD6 100%);border-radius:18px;padding:16px;margin:4px 16px 0;cursor:pointer;box-shadow:0 10px 24px rgba(44,107,255,0.28);border:none;text-align:left;width:calc(100% - 32px);font-family:inherit;}
  .home-cta:active{filter:brightness(0.96);}
  .home-cta-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .home-cta-text{display:flex;flex-direction:column;gap:2px;}
  .home-cta-title{color:#fff;font-size:15px;font-weight:600;}
  .home-cta-sub{color:rgba(255,255,255,0.78);font-size:12.5px;}
  .home-cta-arrow{margin-left:auto;flex-shrink:0;}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 4px;}
  .home-tile{background:#fff;border:1px solid var(--h-border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;opacity:0.55;text-align:left;font-family:inherit;}
  .home-tile.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:10px;}
  .home-tile-icon{width:38px;height:38px;border-radius:11px;background:var(--h-accent-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .home-tile-label{color:var(--h-text-body);font-size:13.5px;font-weight:500;line-height:1.3;}
  .home-section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px;}
  .home-section-title{color:var(--h-text-primary);font-size:16px;font-weight:600;}
  .home-section-link{color:var(--h-accent);font-size:13px;font-weight:500;background:none;border:none;font-family:inherit;cursor:pointer;padding:0;}
  .home-request-card{margin:4px 16px 0;background:#fff;border:1px solid var(--h-border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;opacity:0.55;}
  .home-request-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .home-request-id{color:var(--h-text-primary);font-size:14.5px;font-weight:600;}
  .home-request-status{background:var(--h-accent-tint);color:var(--h-accent);font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;}
  .home-request-meta{display:flex;flex-direction:column;gap:3px;}
  .home-request-line{color:var(--h-text-secondary);font-size:13.5px;}
  .home-request-vin{color:var(--h-text-faint);font-size:12px;font-family:ui-monospace,monospace;}
  .home-progress{display:flex;gap:5px;}
  .home-progress span{flex:1;height:4px;border-radius:2px;background:var(--h-border);}
  .home-progress span.filled{background:var(--h-accent);}
  .home-request-bottom{display:flex;align-items:center;justify-content:space-between;}
  .home-request-updated{color:var(--h-text-faint);font-size:12px;}
  .home-request-more{color:var(--h-accent);font-size:12.5px;font-weight:500;background:none;border:none;font-family:inherit;cursor:pointer;padding:0;}
  .home-new-request{background:var(--h-ink);border-radius:16px;padding:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none;width:calc(100% - 32px);margin:0 16px;opacity:0.55;font-family:inherit;}
  .home-new-request span{color:#fff;font-size:15px;font-weight:600;}
  .home-footer-pad{padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));}
</style>
</head>

<script>
/* ============== TELEGRAM WEBAPP + НАВИГАЦИЯ ==============
   Этот файл отвечает ТОЛЬКО за интерфейс главного экрана и переходы между вкладками.
   Логика расчёта утильсбора живёт отдельно, в /tabs/utilsbor/ — правки здесь её не касаются.
   Чтобы добавить новую вкладку в будущем: создать папку /tabs/имя-вкладки/ со своим
   index.html, и в одной из плиток ниже заменить data-soon="1" на
   onclick="window.location.href='tabs/имя-вкладки/index.html'" — остальной код трогать не нужно. */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if(tg){
  tg.ready();
  tg.expand();
  try{ tg.setHeaderColor('#F4F5F7'); }catch(e){}
  try{ tg.setBackgroundColor('#F4F5F7'); }catch(e){}
  tg.BackButton.hide();
}

document.getElementById('openCalcBtn').addEventListener('click', function(){
  if(tg){ try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){} }
  window.location.href = 'tabs/utilsbor/index.html';
});

// заглушки остальных плиток — раздел пока не реализован
document.querySelectorAll('[data-soon]').forEach(el => {
  el.addEventListener('click', function(){
    const msg = 'Этот раздел скоро появится. Пока доступен расчёт утильсбора.';
    if(tg && tg.showAlert){ tg.showAlert(msg); } else { alert(msg); }
  });
});
</script>
