<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Таможенное оформление</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../../application-api.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#0e1013;--muted:#6b7280;--border:#e6e8ec;--blue:#2c6bff;--tint:#edf2ff;--green:#16803c;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:680px;margin:auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.back{border:0;background:#fff;border-radius:12px;width:42px;height:42px;font-size:24px}.title{font-size:20px;font-weight:700}.sub{font-size:13px;color:var(--muted);margin-top:2px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}.intro{font-size:14px;line-height:1.5;color:#4b5563}.notice{border-left:4px solid #6fb58a;padding:8px 12px;margin-top:12px;color:#374151;font-size:13px;line-height:1.45}.categories{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{border:1px solid var(--border);background:#fff;border-radius:14px;padding:13px 10px;text-align:left;font:600 13px/1.3 inherit;color:var(--text)}.cat.active{border-color:var(--blue);background:var(--tint);color:#1749bd}.section-title{font-size:17px;font-weight:700;margin-bottom:5px}.section-copy{font-size:13px;line-height:1.45;color:var(--muted);margin-bottom:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--border);background:#fff;border-radius:13px;padding:13px;font:16px inherit;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--blue)}.hint{font-size:12px;color:var(--muted);margin-top:5px}.primary{width:100%;border:0;border-radius:14px;background:#0e1013;color:#fff;padding:14px;font:600 15px inherit;margin-top:8px}.primary:disabled{opacity:.5}.candidates{display:grid;gap:8px;margin-top:12px}.candidate{border:1px solid var(--border);background:#fff;border-radius:13px;padding:12px;text-align:left;font:13px/1.4 inherit}.candidate b{display:block;font-size:14px;margin-bottom:3px}.result{border:1px solid #b7dfc4;background:#f5fff8}.result h2{font-size:18px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid #e8f3eb;font-size:13px}.row span:last-child{text-align:right;font-weight:600}.total{font-size:16px;font-weight:700;color:var(--green);border:0;padding-top:12px}.disclaimer{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px}.error{color:var(--red);font-size:13px;margin-top:10px}.hidden{display:none!important}@media(max-width:390px){.categories{grid-template-columns:1fr}.page{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<main class="page">
  <div class="top"><button class="back" id="backBtn" aria-label="Назад">‹</button><div><div class="title">Таможенное оформление</div><div class="sub">Предварительный расчёт для автомобиля</div></div></div>
  <section class="card intro">
    Расчёт включает таможенную пошлину, государственный таможенный сбор за операции и утилизационный сбор.
    <div class="notice">Окончательную таможенную стоимость определяет таможенный орган. Возможна корректировка стоимости инспектором.</div>
  </section>
  <section class="card"><div class="categories" id="categories">
    <button class="cat active" data-mode="under3">🚗 Автомобиль до 3 лет</button>
    <button class="cat" data-mode="over3-3-5">🚙 От 3 до 5 лет</button>
    <button class="cat" data-mode="over3-5">🚙 Старше 5 лет</button>
    <button class="cat" data-mode="electric">⚡ Электро / последовательный гибрид</button>
    <button class="cat" data-mode="pickup">🛻 Пикап</button>
  </div></section>
  <section class="card" id="calculator"></section>
  <section class="card result hidden" id="result"></section>
</main>
<script type="module">
import { loadCatalog, parseCatalogQuery, searchCatalog, calculationPower } from '../../bot/src/catalog-search.js';
import { UTIL_RATES } from '../../bot/src/rates-data.js';
import { calculateCustomsProcessingFee, calculateElectricCustoms, calculatePassengerOver3, calculatePassengerUnder3, calculatePickup, parsePositiveNumber } from '../../bot/src/customs-calculation.js';

const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#f4f5f7');tg.setBackgroundColor('#f4f5f7')}catch(_){}tg.BackButton.show();tg.BackButton.onClick(()=>location.href='../../index.html')}
document.getElementById('backBtn').onclick=()=>location.href='../../index.html';
const calculator=document.getElementById('calculator'),resultEl=document.getElementById('result');
let mode='under3',euroRate=null,candidates=[];
const money=v=>Math.round(Number(v)).toLocaleString('ru-RU')+' ₽';
const esc=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML};
const ageLabel=a=>a==='new'?'до 3 лет':'старше 3 лет';

async function getEuro(){if(euroRate)return euroRate;const r=await fetch('https://grani-miniapp2.4000680.workers.dev/api/rates/eur',{cache:'no-store'});if(!r.ok)throw new Error('Не удалось получить курс евро ЦБ РФ');euroRate=(await r.json()).rate;return euroRate}
function ageStatus(year){const d=new Date().getFullYear()-Number(year);return d<3?['new']:d>3?['old']:['new','old']}
function rateRow(payer,kw,ccm){const electric=!ccm;return UTIL_RATES.find(row=>{const payerOk=payer==='commercial'?row.payer.toLowerCase().startsWith('коммерч'):row.payer.toLowerCase().startsWith('личн');return payerOk&&row.engine.toLowerCase().startsWith('электро')===electric&&(electric||(ccm>=(row.ccmFrom??0)&&ccm<=(row.ccmTo??Infinity)))&&kw>=row.kwFrom&&kw<=(row.kwTo??Infinity)})}
function calculateUtil(year,kw,ccm){const commercial=rateRow('commercial',kw,ccm),personal=rateRow('personal',kw,ccm);if(!commercial||!personal)throw new Error('Для этих характеристик не найдена ставка утильсбора');return ageStatus(year).map(age=>({age,commercial:age==='new'?commercial.sumNew:commercial.sumOld,personal:age==='new'?personal.sumNew:personal.sumOld}))}
function selectedUtil(item){return item.personal!==item.commercial?item.personal:item.commercial}

function commonVehicleFields(includeValue=true){return `${includeValue?`<div class="field"><label>Таможенная стоимость, ₽</label><input id="value" inputmode="numeric" placeholder="Например, 2 500 000"></div>`:''}<div class="field"><label>Точный объём двигателя, см³</label><input id="ccm" inputmode="numeric" placeholder="Например, 1998"></div><div class="field"><label>Марка, полная модель и год</label><input id="vehicle" placeholder="Например, BMW X5 xDrive30d 2022"></div><div class="field"><label>Масса по шильдику, кг <span style="font-weight:400;color:var(--muted)">(необязательно)</span></label><input id="weight" inputmode="numeric" placeholder="Например, 2860"></div><button class="primary" id="searchBtn">Найти автомобиль и рассчитать</button><div id="error" class="error"></div><div id="candidates" class="candidates"></div>`}
function render(){resultEl.classList.add('hidden');if(mode==='pickup'){calculator.innerHTML=`<div class="section-title">Пикап N1/N1G до 5 тонн</div><div class="section-copy">Пошлина зависит от возраста, топлива и стоимости. Утильсбор рассчитывается по полной массе.</div><div class="field"><label>Возраст</label><select id="pickupAge"><option value="0-3">0–3 года</option><option value="3-5">3–5 лет</option><option value="5-7">5–7 лет</option><option value="7+">7 лет и старше</option></select></div><div class="field"><label>Топливо</label><select id="fuel"><option value="petrol">Бензин</option><option value="diesel">Дизель</option></select></div><div class="field"><label>Таможенная стоимость, ₽</label><input id="value" inputmode="numeric" placeholder="Например, 3 500 000"></div><div class="field" id="pickupCcmField"><label>Объём двигателя, см³</label><input id="ccm" inputmode="numeric" placeholder="Например, 2755"></div><div class="field"><label>Полная масса по шильдику, кг</label><input id="mass" inputmode="numeric" placeholder="Например, 3000"></div><button class="primary" id="pickupBtn">Рассчитать</button><div id="error" class="error"></div>`;document.getElementById('pickupBtn').onclick=calculatePickupResult;document.getElementById('pickupAge').onchange=togglePickupCcm;document.getElementById('fuel').onchange=togglePickupCcm;togglePickupCcm();return}
if(mode==='electric'){calculator.innerHTML=`<div class="section-title">Электро и последовательные гибриды</div><div class="section-copy">Сначала найдём точную модель. Для акциза сложим мощности ДВС и электромотора, для утильсбора возьмём только 30‑минутную мощность.</div><div class="field"><label>Таможенная стоимость, ₽</label><input id="value" inputmode="numeric" placeholder="Например, 4 000 000"></div><div class="field"><label>Марка, полная модель и год</label><input id="vehicle" placeholder="Например, LIXIANG L7 2024"></div><div class="field"><label>Масса по шильдику, кг <span style="font-weight:400;color:var(--muted)">(необязательно)</span></label><input id="weight" inputmode="numeric" placeholder="Например, 3080"></div><button class="primary" id="searchBtn">Найти автомобиль и рассчитать</button><div id="error" class="error"></div><div id="candidates" class="candidates"></div>`}else{const title=mode==='under3'?'Автомобиль до 3 лет':mode==='over3-3-5'?'Автомобиль от 3 до 5 лет':'Автомобиль старше 5 лет';calculator.innerHTML=`<div class="section-title">${title}</div><div class="section-copy">После расчёта пошлины бот добавит государственный таможенный сбор и утильсбор по выбранной модели.</div>${commonVehicleFields()}`}
document.getElementById('searchBtn').onclick=findVehicles}

function togglePickupCcm(){const age=document.getElementById('pickupAge').value,fuel=document.getElementById('fuel').value;document.getElementById('pickupCcmField').classList.toggle('hidden',!(age==='7+'||(fuel==='petrol'&&age==='0-3')||(fuel==='diesel'&&age==='5-7')))}
async function findVehicles(){const err=document.getElementById('error'),box=document.getElementById('candidates');err.textContent='';box.innerHTML='';const query=parseCatalogQuery(document.getElementById('vehicle').value),value=parsePositiveNumber(document.getElementById('value').value),weight=parsePositiveNumber(document.getElementById('weight').value);if(!query){err.textContent='Введите марку, полную модель и один год выпуска.';return}if(!value){err.textContent='Введите таможенную стоимость автомобиля.';return}if(mode!=='electric'&&!parsePositiveNumber(document.getElementById('ccm').value)){err.textContent='Введите точный объём двигателя.';return}try{document.getElementById('searchBtn').disabled=true;document.getElementById('searchBtn').textContent='Загружаю справочник…';const catalog=await loadCatalog('../../tabs/utilsbor/spravochnik.json.gz.b64');candidates=searchCatalog(catalog,query,weight||null,12);if(!candidates.length)throw new Error('Автомобиль не найден. Уточните полную модификацию или массу.');box.innerHTML=candidates.map((c,i)=>`<button class="candidate" data-i="${i}"><b>${esc(c.brand)} ${esc(c.model)}, ${c.year}</b>${c.combustionKw?c.combustionKw+' кВт ДВС':''}${c.electricKw?(c.combustionKw?' + ':'')+c.electricKw+' кВт (30‑мин.)':''} · масса ${c.mass||c.massFrom||'—'} кг</button>`).join('');box.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>calculatePassengerResult(candidates[Number(b.dataset.i)]))}catch(e){err.textContent=e.message||e}finally{document.getElementById('searchBtn').disabled=false;document.getElementById('searchBtn').textContent='Найти автомобиль и рассчитать'}}

async function calculatePassengerResult(candidate){try{const value=parsePositiveNumber(document.getElementById('value').value),fee=calculateCustomsProcessingFee(value),rate=await getEuro();let customsPayments,details='',ccm=null,utilPower;if(mode==='electric'){utilPower=calculationPower(candidate,true);const excisePower=(candidate.combustionKw||0)+(candidate.electricKw||0),c=calculateElectricCustoms({customsValueRub:value,excisePowerKw:excisePower});customsPayments=c.customsTotal;details=`<div class="row"><span>Ввозная пошлина 15%</span><span>${money(c.duty)}</span></div><div class="row"><span>Акциз</span><span>${money(c.excise)}</span></div><div class="row"><span>НДС 22%</span><span>${money(c.vat)}</span></div>`}else{ccm=parsePositiveNumber(document.getElementById('ccm').value);utilPower=calculationPower(candidate,false);const c=mode==='under3'?calculatePassengerUnder3({customsValueRub:value,engineCc:ccm,euroRate:rate}):calculatePassengerOver3({ageGroup:mode==='over3-3-5'?'3-5':'5+',engineCc:ccm,euroRate:rate});customsPayments=c.duty;details=`<div class="row"><span>Таможенная пошлина</span><span>${money(c.duty)}</span></div>`}const util=calculateUtil(candidate.year,utilPower,ccm),totals=util.map(u=>customsPayments+fee+selectedUtil(u));resultEl.innerHTML=`<h2>✅ Предварительный расчёт</h2><div class="row"><span>Автомобиль</span><span>${esc(candidate.brand)} ${esc(candidate.model)}, ${candidate.year}</span></div><div class="row"><span>Таможенная стоимость</span><span>${money(value)}</span></div>${details}<div class="row"><span>Таможенный сбор за операции</span><span>${money(fee)}</span></div>${util.map(u=>`<div class="row"><span>Утильсбор (${ageLabel(u.age)})</span><span>${money(selectedUtil(u))}</span></div><div class="row total"><span>Итого (${ageLabel(u.age)})</span><span>${money(customsPayments+fee+selectedUtil(u))}</span></div>`).join('')}<div class="disclaimer">Расчёт предварительный. Услуги таможенного представителя и иные сопутствующие расходы не включены.</div>`;resultEl.classList.remove('hidden');await window.GraniApplications?.add({source:'Мини‑приложение',calculationType:'customs',brand:candidate.brand,model:candidate.model,year:candidate.year,category:'M1',kw:utilPower,ccm,customsValue:value,customsDuty:customsPayments,customsFee:fee,utilAmount:util.length===1?selectedUtil(util[0]):null,amount:totals.length===1?totals[0]:null,amountLabel:totals.length>1?totals.map(money).join(' / '):''})}catch(e){document.getElementById('error').textContent=e.message||e}}

async function calculatePickupResult(){const err=document.getElementById('error');err.textContent='';try{const value=parsePositiveNumber(document.getElementById('value').value),age=document.getElementById('pickupAge').value,fuel=document.getElementById('fuel').value,mass=parsePositiveNumber(document.getElementById('mass').value),needsCcm=age==='7+'||(fuel==='petrol'&&age==='0-3')||(fuel==='diesel'&&age==='5-7'),ccm=needsCcm?parsePositiveNumber(document.getElementById('ccm').value):1;if(!value||!mass||!ccm)throw new Error('Заполните все необходимые поля.');const rate=await getEuro(),c=calculatePickup({customsValueRub:value,fuel,ageGroup:age,engineCc:ccm,maxMassKg:mass,euroRate:rate}),fee=calculateCustomsProcessingFee(value),total=c.total+fee;resultEl.innerHTML=`<h2>✅ Предварительный расчёт пикапа</h2><div class="row"><span>Ввозная пошлина</span><span>${money(c.duty)}</span></div><div class="row"><span>НДС 22%</span><span>${money(c.vat)}</span></div><div class="row"><span>Таможенный сбор за операции</span><span>${money(fee)}</span></div><div class="row"><span>Утильсбор</span><span>${money(c.util)}</span></div><div class="row total"><span>Итого</span><span>${money(total)}</span></div><div class="disclaimer">Окончательная сумма зависит от классификации автомобиля и таможенной стоимости. Услуги таможенного представителя не включены.</div>`;resultEl.classList.remove('hidden');await window.GraniApplications?.add({source:'Мини‑приложение',calculationType:'customs',brand:'Пикап',model:fuel==='petrol'?'бензин':'дизель',category:'N1/N1G',ccm:needsCcm?ccm:null,customsValue:value,customsDuty:c.customsTotal,customsFee:fee,utilAmount:c.util,amount:total,amountLabel:age})}catch(e){err.textContent=e.message||e}}

document.getElementById('categories').onclick=e=>{const b=e.target.closest('.cat');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x===b));render()};render();
</script>
</body>
</html>
