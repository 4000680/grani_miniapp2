name: Verify FTS changes
on:
  push:
    branches: [main, codex/fts-compact]
    paths:
      - 'bot/src/fts*.js'
      - 'bot/src/applications-store.js'
      - 'bot/test/fts*.mjs'
      - '.github/workflows/verify-fts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
