name: Verify FTS changes
on:
  push:
    branches: [main, codex/fts-compact]
    paths:
      - 'bot/src/fts*.js'
      - 'bot/src/applications-store.js'
      - 'bot/test/fts*.mjs'
      - 'bot/test/declaration-category-flow.test.mjs'
      - '.github/workflows/verify-fts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify deployed FTS version
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://grani-miniapp2.4000680.workers.dev/api/website/fts';
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              const response = await fetch(endpoint, {
                method: 'POST', signal: AbortSignal.timeout(10000), cache: 'no-store',
                headers: { Origin: 'https://grani-br.ru', 'Content-Type': 'application/json' },
                body: '{}'
              });
              const health = await response.json();
              console.log('Endpoint validation status:', response.status);
              if (response.status === 400 && health.code === 'INVALID_INPUT') process.exit(0);
            } catch (error) {
              console.log('Deployment check:', error.message);
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Expected deployed FTS version was not observed');
          NODE
